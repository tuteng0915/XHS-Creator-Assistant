<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" fill="none" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">小红书创作助手 — 认识账号，听见读者，打磨下一篇</title>
  <desc id="cover-desc">柔和红色与中性灰封面。左侧为产品名称与“用自己的积累，写好下一篇”标语，右侧用账号卡、读者头像和创作卡呈现创作者工作区的概念流程。这是品牌插图，不是产品界面截图。</desc>
