<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" fill="none" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">SqsAgent — 从认识账号，到听见读者。</title>
