<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;background:#fcfcfb">
<rect width="760" height="250" fill="#fcfcfb"/>
<text x="24" y="34" font-size="17" fill="#0b0b0b">QSheep 5 篇留出笔记：模拟读者组与直接预测对照</text>
<text x="24" y="56" font-size="12" fill="#52514e">只计公开留言和回应；真实评论为每篇抓到的至多 10 条一级评论</text>
<text x="24" y="92" font-size="13" fill="#0b0b0b">真实评论主题被提到的比例</text>
<text x="24" y="129" font-size="12" fill="#52514e">模拟读者组</text>
<rect x="114" y="114" width="230" height="22" rx="4" fill="#efeeea"/>
<rect x="114" y="114" width="15.4" height="22" rx="4" fill="#2a78d6"/>
<text x="135.4" y="130" font-size="12" fill="#0b0b0b">7%（1/15）</text>
<text x="24" y="181" font-size="12" fill="#52514e">直接预测评论</text>
<rect x="114" y="166" width="230" height="22" rx="4" fill="#efeeea"/>
<rect x="114" y="166" width="76.6" height="22" rx="4" fill="#eb6834"/>
<text x="196.6" y="182" font-size="12" fill="#0b0b0b">33%（5/15）</text>
<text x="394" y="92" font-size="13" fill="#0b0b0b">预测条目在真实评论里出现的比例</text>
<text x="394" y="129" font-size="12" fill="#52514e">模拟读者组</text>
<rect x="484" y="114" width="230" height="22" rx="4" fill="#efeeea"/>
<rect x="484" y="114" width="26.2" height="22" rx="4" fill="#2a78d6"/>
<text x="516.2" y="130" font-size="12" fill="#0b0b0b">11%（5/44）</text>
<text x="394" y="181" font-size="12" fill="#52514e">直接预测评论</text>
<rect x="484" y="166" width="230" height="22" rx="4" fill="#efeeea"/>
<rect x="484" y="166" width="63.3" height="22" rx="4" fill="#eb6834"/>
<text x="553.2" y="182" font-size="12" fill="#0b0b0b">28%（11/40）</text>
<text x="24" y="232" font-size="11" fill="#7a7974">主题由模型只看真实评论归纳；匹配时条目来源匿名、顺序打乱。“其他/无法判断”主题不计入。</text></svg>