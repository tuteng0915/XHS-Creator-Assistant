<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>创作者选题共创助手 · Demo</title>
<style>
  :root{
    --red:#ff2442;--red-soft:#fff0f2;--ink:#1f2329;--sub:#6b7280;
    --line:#ececf0;--bg:#f6f7f9;--card:#fff;--ok:#16a34a;--warn:#d97706;
    --indigo:#4f46e5;--indigo-soft:#eef2ff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 80px}
  header.top{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .logo{width:38px;height:38px;border-radius:10px;background:var(--red);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px}
  h1{font-size:21px;margin:0}
  .tagline{color:var(--sub);font-size:13px;margin:2px 0 18px}
  .workflow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  .wf{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:12.5px;color:var(--sub)}
  .wf b{color:var(--red)}
  .grid{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .panel h2{font-size:14px;margin:0 0 12px;display:flex;align-items:center;gap:7px}
  label{font-size:12.5px;color:var(--sub);display:block;margin:12px 0 5px;font-weight:600}
  textarea,input,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;
    font-size:13px;font-family:inherit;resize:vertical;background:#fdfdfd;color:var(--ink)}
  textarea:focus,input:focus{outline:none;border-color:var(--red)}
  .btn{border:none;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
  .btn-primary{background:var(--red);color:#fff;flex:1}
  .btn-primary:hover{filter:brightness(.94)}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink);flex:1}
  .btn-ghost:hover{background:#fafafa}
  .btn-sim{background:#fff;border:1.5px solid var(--indigo);color:var(--indigo);
    border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;flex:1}
  .btn-sim:hover{background:var(--indigo-soft)}
  .btns{display:flex;gap:8px;margin-top:16px}
  .mode{display:flex;gap:6px;background:#f1f2f4;border-radius:10px;padding:4px;margin-bottom:14px}
  .mode button{flex:1;border:none;background:transparent;padding:7px;border-radius:7px;
    font-size:12.5px;cursor:pointer;color:var(--sub);font-weight:600}
  .mode button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .api-box{display:none;border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
  .api-box.show{display:block}
  .hint{font-size:11.5px;color:var(--sub);margin-top:6px;line-height:1.5}
  .sim-divider{border-top:1px dashed var(--line);margin:14px 0 0;padding-top:12px}

  /* output */
  #out{min-height:200px}
  .empty{color:var(--sub);text-align:center;padding:60px 20px;font-size:13.5px}
  .stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  .stage-h{display:flex;align-items:center;gap:9px;margin-bottom:13px}
  .stage-n{width:24px;height:24px;border-radius:7px;background:var(--red-soft);color:var(--red);
    font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .stage-n.indigo{background:var(--indigo-soft);color:var(--indigo)}
  .stage-h h3{font-size:15px;margin:0}
  .stage-h .desc{font-size:11.5px;color:var(--sub);margin-left:auto}
  .stage-loading{text-align:center;padding:28px 20px;color:var(--sub);font-size:13px}
  .pp{border-left:3px solid var(--red);background:#fafafa;border-radius:0 8px 8px 0;padding:10px 13px;margin-bottom:9px}
  .pp-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .pp-top b{font-size:13.5px}
  .tag{font-size:11px;padding:1px 8px;border-radius:999px;font-weight:600}
  .tag.high{background:#fdeaea;color:#d62828}
  .tag.mid{background:#fff3e0;color:var(--warn)}
  .tag.cnt{background:#eef2ff;color:var(--indigo)}
  .quote{font-size:12px;color:var(--sub);background:#fff;border:1px solid var(--line);
    border-radius:6px;padding:4px 9px;margin:3px 4px 0 0;display:inline-block}
  .topic{border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:11px}
  .topic h4{margin:0 0 4px;font-size:14.5px}
  .topic .angle{font-size:12.5px;color:var(--sub);margin-bottom:8px}
  .why{background:var(--red-soft);border-radius:8px;padding:8px 11px;font-size:12.5px}
  .why b{color:var(--red)}
  .topic-actions{margin-top:9px;display:flex;gap:6px}
  .btn-fill{font-size:11.5px;padding:4px 11px;border-radius:7px;border:1px solid var(--indigo);
    background:var(--indigo-soft);color:var(--indigo);cursor:pointer;font-weight:600;transition:.12s}
  .btn-fill:hover{background:var(--indigo);color:#fff}
  .titles{display:flex;flex-direction:column;gap:6px;margin-top:7px}
  .titlev{display:flex;align-items:flex-start;gap:8px;font-size:13px;background:#fafafa;border-radius:7px;padding:7px 10px}
  .titlev span{color:var(--red);font-weight:700;font-size:12px;flex-shrink:0}
  .outline{counter-reset:s}
  .ol{display:flex;gap:11px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .ol:last-child{border-bottom:none}
  .ol .sec{flex-shrink:0;width:88px;font-size:12.5px;font-weight:700;color:var(--red)}
  .ol .ct{font-size:12.5px;color:#444}
  .reuse{margin-top:11px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:9px;padding:10px 13px;font-size:12.5px}
  .reuse b{color:var(--ok)}
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
  @media(max-width:560px){.cmp{grid-template-columns:1fr}}
  .cmp-col{border-radius:10px;padding:11px 13px;font-size:12.5px}
  .cmp-win{background:#f0fdf4;border:1px solid #bbf7d0}
  .cmp-lose{background:#fef2f2;border:1px solid #fecaca}
  .cmp-col h5{margin:0 0 7px;font-size:13px;display:flex;justify-content:space-between}
  .cmp-win h5{color:var(--ok)}.cmp-lose h5{color:#b91c1c}
  .cmp-item{font-size:11.5px;color:#555;padding:2px 0}
  .cmp-item b{color:var(--ink)}
  .cmp-col ul{margin:7px 0 0;padding-left:16px}
  .cmp-col li{margin:2px 0}
  .takeaway{margin-top:10px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:9px;padding:10px 13px;font-size:12.5px}
  .takeaway b{color:#1d4ed8}
  .takeaway ol{margin:5px 0 0;padding-left:18px}.takeaway li{margin:3px 0}
  .spinner{width:18px;height:18px;border:2.5px solid var(--red-soft);border-top-color:var(--red);
    border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:-3px;margin-right:6px}
  .spinner.indigo{border-color:#e0e7ff;border-top-color:var(--indigo)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:9px;padding:11px 13px;font-size:12.5px}
  .badge{display:inline-block;font-size:11px;background:#eef2ff;color:var(--indigo);border-radius:999px;padding:2px 9px;margin-left:8px;font-weight:600;vertical-align:1px}

  /* ── Simulation ── */
  .persona-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
  @media(max-width:700px){.persona-grid{grid-template-columns:1fr}}
  .persona-card{border-radius:10px;border:1px solid var(--line);padding:12px;background:#fafafa}
  .persona-hdr{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .persona-av{width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;font-size:14px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .persona-av.sm{width:22px;height:22px;font-size:11px}
  .persona-name{font-size:13.5px;font-weight:700;line-height:1.3}
  .persona-type{font-size:11.5px;color:var(--sub);line-height:1.3}
  .persona-type.ml{margin-left:4px}
  .persona-detail{font-size:12px;color:#555;margin:3px 0;line-height:1.5}
  .persona-detail b{color:var(--ink)}
  .chat-msg{border-radius:0 10px 10px 0;background:#fafafa;padding:10px 13px;margin-bottom:9px;transition:opacity .3s}
  .chat-msg.debate{background:#f0f4ff}
  .chat-msg.loading{opacity:.6}
  .chat-who{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
  .chat-who b{font-size:13px}
  .chat-text{font-size:13px;color:#333;line-height:1.65}
  .sentiment-icon{margin-left:auto;font-size:15px}
  .stance-tag{margin-left:auto;font-size:11px;background:#eef2ff;color:var(--indigo);
    padding:1px 8px;border-radius:999px;font-weight:600}
  .syn-block{background:var(--red-soft);border:1px solid #ffd9de;border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .syn-row{font-size:13px;font-weight:600;margin-bottom:4px}
  .syn-reason{font-size:12.5px;color:#444;margin-bottom:4px}
  .syn-behavior{font-size:12px;color:var(--sub)}
  .syn-label{font-size:12.5px;font-weight:700;color:var(--ink);margin:10px 0 5px}
  .syn-list{margin:0;padding-left:18px}
  .syn-list li{font-size:12.5px;color:#444;margin:4px 0}
  /* ── Workflow switcher ── */
  .wf-switch{display:flex;gap:6px;background:#f1f2f4;border-radius:10px;padding:4px;margin-bottom:14px}
  .wf-switch button{flex:1;border:none;background:transparent;padding:7px;border-radius:7px;font-size:12.5px;cursor:pointer;color:var(--sub);font-weight:600}
  .wf-switch button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .csv-upload{display:flex;align-items:center;gap:8px;margin-top:6px}
  .btn-csv-upload{font-size:12px;padding:5px 11px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--sub);font-weight:600;display:inline-block}
  .btn-csv-upload:hover{background:#fafafa}
  #csvStat{font-size:11.5px;color:var(--ok)}
  .trend-theme{border-left:3px solid var(--warn);background:#fafafa;border-radius:0 8px 8px 0;padding:10px 13px;margin-bottom:9px}
  .trend-theme-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .trend-theme-top b{font-size:13.5px}
  .opportunity{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:9px;padding:10px 13px;margin-bottom:8px;font-size:12.5px}
  .opportunity b{color:var(--ok)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">薯</div>
    <div>
      <h1>创作者内容诊断与选题共创助手 <span class="badge">Prototype</span></h1>
    </div>
  </header>
  <p class="tagline">围绕小红书公开内容样本与评论区反馈,把「主页诊断 → 痛点归类 → 选题生成 → 结构复盘」做成可复用工作流。</p>

  <div class="workflow">
    <div class="wf"><b>①</b> 主页诊断</div>
    <div class="wf"><b>②</b> 痛点归类</div>
    <div class="wf"><b>③</b> 选题生成</div>
    <div class="wf"><b>④</b> 结构复盘</div>
    <div class="wf" style="background:#eef2ff;border-color:#c7d2fe"><b style="color:var(--indigo)">👥</b> 受众模拟 · 多智能体讨论</div>
  </div>

  <div class="grid">
    <!-- LEFT: input -->
    <div class="panel">
      <h2>📥 输入</h2>

      <div class="wf-switch">
        <button id="wf-a" class="active" onclick="setWorkflow('a')">📊 账号诊断</button>
        <button id="wf-b" onclick="setWorkflow('b')">🔥 热点分析</button>
      </div>
      <button class="btn btn-ghost" onclick="loadSample()" style="width:100%;margin-bottom:14px;font-size:12.5px">↺ 载入样例</button>

      <label>账号定位</label>
      <textarea id="positioning" rows="4"></textarea>

      <!-- Tab A: account diagnosis -->
      <div id="tab-a">
        <label>主页 / 历史笔记 + 数据(格式:标题 ｜ 数据 ｜ 爆/平/差)</label>
        <textarea id="notes" rows="6"></textarea>
        <label>评论区原文(一行一条,越多越准)</label>
        <textarea id="comments" rows="7"></textarea>
      </div>

      <!-- Tab B: trend analysis -->
      <div id="tab-b" style="display:none">
        <label>话题关键词</label>
        <input id="trendKeyword" type="text" placeholder="例：数字游民、留学申请、健身减脂…" />
        <label>热帖数据(CSV 粘贴或上传文件 · 需含标题/点赞/收藏字段)</label>
        <textarea id="csvText" rows="6" placeholder="从小红书采集的 CSV 数据，直接粘贴或点击右侧上传按钮&#10;字段：title, likes, collects, comments, tags, content_snippet, date"></textarea>
        <div class="csv-upload">
          <label for="csvFile" class="btn-csv-upload">📂 上传 .csv 文件</label>
          <input id="csvFile" type="file" accept=".csv,.tsv" onchange="handleFileUpload(this)" style="display:none" />
          <span id="csvStat"></span>
        </div>
      </div>

      <div class="sim-divider">
        <label>👥 下期选题(受众模拟的测试内容)</label>
        <textarea id="simTopic" rows="2" placeholder="填入想测试受众反应的选题标题或草稿，或从③选题生成中一键填入 →"></textarea>
      </div>

      <div class="mode" style="margin-top:14px">
        <button id="m-demo" class="active" onclick="setMode('demo')">演示模式 · 预置真实样例</button>
        <button id="m-live" onclick="setMode('live')">实时生成 · Claude API</button>
      </div>

      <div class="api-box" id="apiBox">
        <label>Anthropic API Key(仅本地浏览器使用,不上传)</label>
        <input id="apiKey" type="password" placeholder="sk-ant-..." />
        <p class="hint">实时模式使用 claude-sonnet-4-6。演示与实时共用同一渲染器。</p>
      </div>

      <div class="btns">
        <button class="btn btn-primary" id="runBtn" onclick="run()">⚡ 生成诊断</button>
        <button class="btn-sim" onclick="runSimulation()">👥 受众模拟</button>
      </div>
    </div>

    <!-- RIGHT: output -->
    <div id="out">
      <div class="empty">👈 左侧已预置 @QSheep 留学赛道的真实样例<br/>点「生成诊断」查看五段工作流，或点「受众模拟」体验多智能体讨论<br/><br/>③ 选题生成中每条选题可一键填入「下期选题」栏</div>
    </div>
  </div>
</div>

<script>
const delay = ms => new Promise(r => setTimeout(r, ms));

/* ── 样本数据 ─────────────────────────────────────────── */
const SAMPLE = {
  positioning:`账号:@QSheep｜留学内容创作者,1.4K 粉。核心人群=正在准备/纠结出国读研的文科生(传媒、社科、人类学),目标英港新前30。
内容主张:真实反思 + 决策方法,不贩卖焦虑、不灌鸡汤。
作者优势:亲历者视角、擅长把模糊焦虑拆成可执行的决策步骤、文笔好。
目标:选题持续围绕「选校决策 / 申请策略 / 留学反思」,但要避开已经写过的老话题。`,
  notes:`二本逆袭G5?别再被这种标题骗了 ｜ 赞1.4k 藏980 ｜ 爆
留学中介到底值不值5万块|我的真实账单与避坑清单 ｜ 赞1.1k 藏860 ｜ 爆
选校时我后悔没早知道的6件事 ｜ 赞720 藏610 ｜ 爆
文科留学回国到底有没有用|工作一年后说点实话 ｜ 赞90 藏40 ｜ 平
DIY申请时间线:从大三暑假到递交我每个月都干了啥 ｜ 赞60 藏150 ｜ 差`,
  comments:`中介那部分太真实了,我现在就纠结要不要DIY,自己怕搞砸
想问下双非背景冲英国前30有戏吗,真的好焦虑
回国后发现海归学历根本不值钱,有点后悔
求一个选校时间线!完全不知道几月该干嘛,好慌
文书到底自己写还是找人改啊,我憋了两周写不出来
家里不太支持留学,该怎么说服父母
雅思一直卡6.5,是不是该先把雅思考完再准备申请
想知道港三和英国前30到底怎么选,纠结死了
均分85冲刺前20稳吗,GPA算是劣势吗
看了好多博主都在贩卖焦虑,终于有人好好说话了
转专业申请会不会很吃亏,本科传媒想转社科
预算有限,中介和DIY的钱到底该花在哪一步
实习经历很水,文书里要不要硬写
拿到offer了但突然不确定该不该去,好迷茫`,
  simTopic:`5万块中介费,该花的是这3步,剩下4步你自己做更好`
};

/* ── 预置诊断产出 ─────────────────────────────────────── */
const SAMPLE_RESULT = {
  profile:{
    pillars:["留学决策反思","申请避坑 / 性价比","背景评估方法论"],
    titleFormulas:[
      {formula:"反预期否定式 ——「别再被X骗了 / 别再问Y」",examples:["二本逆袭G5?别再被这种标题骗了"]},
      {formula:"价值拷问 + 真实账单 ——「X到底值不值|我的真实账单」",examples:["留学中介到底值不值5万块|我的真实账单与避坑清单"]},
      {formula:"亲历复盘 + 数字清单 ——「我后悔没早知道的N件事」",examples:["选校时我后悔没早知道的6件事"]}
    ],
    hookStyles:["亲历者第一人称切入,先认同情绪再反转","用具体数字/账单(5万、6件事)制造真实感","点破一个普遍误区作为靶子"],
    viralStructure:{
      name:"避坑清单体(反直觉钩子 → 立靶 → 亲历佐证 → 逐条拆解 → 可保存清单 → 反问互动)",
      steps:["反直觉钩子(认同+反转)","立靶:点破一个普遍误区","亲历账单/具体数字","逐条拆解成可执行步骤","给一张可保存清单促收藏","结尾反问引导评论"]
    },
    voiceFingerprint:["不贩卖焦虑,反鸡汤","把模糊焦虑拆成可执行步骤","克制、真诚、亲历者口吻"],
    contrast:{
      winners:[{title:"二本逆袭G5?别再被这种标题骗了",metric:"赞1.4k·藏980"},{title:"留学中介到底值不值5万块|真实账单",metric:"赞1.1k·藏860"},{title:"选校时我后悔没早知道的6件事",metric:"赞720·藏610"}],
      losers:[{title:"文科留学回国到底有没有用|说点实话",metric:"赞90·藏40"},{title:"DIY申请时间线:每个月干了啥",metric:"赞60·藏150(收藏>赞)"}],

/* ── esc ──────────────────────────────────────────────── */
function esc(x){return(x==null?"":""+x).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}

/* ── 诊断 Stage HTML 构建器 ──────────────────────────── */
function buildProfileHtml(pr){
  const pillars=(pr.pillars||[]).map(p=>`<span class="quote" style="background:var(--red-soft);border-color:#ffd9de;color:var(--red);font-weight:600">${esc(p)}</span>`).join('');
  const formulas=(pr.titleFormulas||[]).map(f=>`<div class="ol"><div class="sec" style="width:auto;min-width:0;padding-right:10px">公式</div><div class="ct"><b>${esc(f.formula)}</b>${(f.examples||[]).map(e=>`<div class="quote" style="margin-top:4px">例:${esc(e)}</div>`).join('')}</div></div>`).join('');
  const hooks=(pr.hookStyles||[]).map(h=>`<li>${esc(h)}</li>`).join('');
  const vs=pr.viralStructure||{};
  const steps=(vs.steps||[]).map((s,i)=>`<div class="titlev"><span>${i+1}</span>${esc(s)}</div>`).join('');
  const c=pr.contrast;
  let ch='';
  if(c){
    const lst=a=>(a||[]).map(x=>`<div class="cmp-item"><b>${esc(x.title)}</b> · ${esc(x.metric)}</div>`).join('');
    const fac=a=>(a||[]).map(x=>`<li>${esc(x)}</li>`).join('');
    const take=(c.takeaways||[]).map(x=>`<li>${esc(x)}</li>`).join('');
    ch=`<label>📊 高表现 vs 低表现 · 对比诊断</label>
      <div class="cmp">
        <div class="cmp-col cmp-win"><h5><span>✅ 高表现共性</span></h5>${lst(c.winners)}<ul>${fac(c.winFactors)}</ul></div>
        <div class="cmp-col cmp-lose"><h5><span>⚠️ 低表现共性</span></h5>${lst(c.losers)}<ul>${fac(c.loseFactors)}</ul></div>
      </div>
      <div class="takeaway"><b>→ 可执行结论:</b><ol>${take}</ol></div>`;
  }
  return `${ch}
    <label>📚 内容支柱</label><div>${pillars}</div>
    <label>✍️ 惯用标题公式</label><div class="outline">${formulas}</div>
    <label>🪝 开头钩子习惯</label><ul style="margin:4px 0 0;padding-left:18px;font-size:12.5px;color:#444">${hooks}</ul>
    <label>🧱 惯用爆款结构 · <b style="color:var(--red)">${esc(vs.name||'')}</b></label>
    <div class="titles" style="margin-top:6px">${steps}</div>
    `;
}

function buildPainPointsHtml(pp){
  const tagCls=v=>v==='高'?'high':'mid';
  return(pp||[]).map(p=>`
    <div class="pp">
      <div class="pp-top"><b>${esc(p.theme)}</b><span class="tag ${tagCls(p.intensity)}">强度 ${esc(p.intensity)}</span><span class="tag cnt">${p.count} 条相关</span></div>
      <div>${(p.evidence||[]).map(q=>`<span class="quote">"${esc(q)}"</span>`).join('')}</div>
    </div>`).join('');
}

function buildTopicsHtml(topics){
  return(topics||[]).map((t,i)=>`
    <div class="topic">
      <h4>${esc(t.title)}</h4>
      <div class="angle">切入角度:${esc(t.angle)}　·　对应痛点:${esc(t.pain||'')}</div>
      <div class="why"><b>为什么适合这个账号:</b> ${esc(t.whyFit)}</div>
      <div class="topic-actions">
        <button class="btn-fill" onclick="fillSimTopic(${i})">→ 填入下期选题</button>
      </div>
    </div>`).join('');
}

/* ── 诊断·实时模式(Haiku Phase1 并行 + Sonnet Phase2/3) */
async function runLiveChunked(key, sonnetModel){
  const gen=++_gen;
  initDiagnosisStages();
  const pos=document.getElementById('positioning').value;
  const notes=document.getElementById('notes').value;
  const comments=document.getElementById('comments').value;

  let profile, painPoints;

  // Phase 1: Parallel with Haiku
  await Promise.all([
    callChunk(key, sonnetModel, PROMPT_PROFILE,
      `【账号定位】\n${pos}\n\n【历史/对标笔记】\n${notes}`, 2000)
    .then(d=>{if(gen!==_gen)return; profile=d.profile; fillStage(1,buildProfileHtml(profile));})
    .catch(e=>fillStage(1,`<div class="err">① 分析失败: ${esc(e.message)}</div>`)),

    callChunk(key, sonnetModel, PROMPT_PAIN_POINTS,
      `【评论区原文】\n${comments}`, 800,{
      name:'pain_points', description:'痛点归类',
      schema:{type:'object',required:['painPoints'],properties:{painPoints:{type:'array',items:{type:'object',
        required:['theme','intensity','count','evidence'],
        properties:{theme:{type:'string'},intensity:{type:'string',enum:['高','中']},count:{type:'integer'},evidence:{type:'array',items:{type:'string'}}}}}}}})
    .then(d=>{if(gen!==_gen)return; painPoints=d.painPoints; fillStage(2,buildPainPointsHtml(painPoints));})
    .catch(e=>fillStage(2,`<div class="err">② 分析失败: ${esc(e.message)}</div>`))
  ]);

  // Phase 2: Sonnet · Topics + Titles（profile/painPoints 若 Phase1 失败则为 undefined，JSON.stringify 会变 {}，容忍降级）
  if(!profile&&!painPoints){fillStage(3,`<div class="err">③ Phase 1 全部失败，无法生成选题</div>`);fillStage(4,'');return;}
  let topics;
  try{
    const d=await callChunk(key, sonnetModel, PROMPT_TOPICS,
      `【账号定位】\n${pos}\n\n【爆款基因】\n${JSON.stringify({profile})}\n\n【痛点】\n${JSON.stringify({painPoints})}`, 2000);
    topics=d.topics;
    _lastTopics[activeWorkflow]=topics;
    fillStage(3,buildTopicsHtml(topics));
    }catch(e){
    fillStage(3,`<div class="err">③ 生成失败: ${esc(e.message)}</div>`);
    fillStage(4,`<div class="err">④ 生成失败: ${esc(e.message)}</div>`);
    return;
  }

  // Phase 3: Sonnet · Structure
  try{
    const chosen=topics[0]?.title||'';
    const d=await callChunk(key, sonnetModel, PROMPT_STRUCTURE,
      `【账号定位】\n${pos}\n\n【风格指纹】\n${(profile?.voiceFingerprint||[]).join('；')}\n\n【爆款结构】\n${profile?.viralStructure?.name||''}\n\n【选题】\n${chosen}`, 1500);
    fillStage(4,buildStructureHtml(d.structure));
  }catch(e){
    fillStage(4,`<div class="err">④ 生成失败: ${esc(e.message)}</div>`);
  }
}

/* ── Claude API 调用 ─────────────────────────────────── */
function fixJsonNewlines(txt){
  // 状态机：修复 JSON 字符串值内的裸换行/制表符
  // 对于字符串内的裸 " ，判断后面是否紧接 : / , / } / ] / 空白，不是则视为内嵌引号并转义
  let out='', inStr=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(inStr){
      if(c==='\\'){out+=c+(txt[++i]||'');}
      else if(c==='"'){
        // 判断这个 " 是否是字符串结束：后面（跳过空白）紧接结构符才算结束
        let j=i+1;
        while(j<txt.length&&(txt[j]===' '||txt[j]==='\t'))j++;
        const next=txt[j];
        if(next===':'||next===','||next==='}'||next===']'||j>=txt.length){
          inStr=false;out+=c;  // 字符串正常结束
        }else{
          out+='\\"';          // 内嵌的裸引号，转义
        }
      }
      else if(c==='\n'){out+='\\n';}
      else if(c==='\r'){out+='\\r';}
      else if(c==='\t'){out+='\\t';}
      else{out+=c;}
    }else{
      if(c==='"')inStr=true;
      out+=c;
    }
  }
  return out;
}

// tool: {name, description, input_schema} — 使用 Tool Use 时传入，保证返回合法 JSON
async function callChunk(key,model,system,user,maxTokens,tool){
  const body={model,max_tokens:maxTokens,messages:[{role:'user',content:user}]};
  if(tool){
    // Tool Use 模式：system 仍作主要指令，tool.description 只是元数据
    if(system) body.system=system;
    body.tools=[{name:tool.name,description:tool.description||'',input_schema:tool.schema}];
    body.tool_choice={type:'tool',name:tool.name};
  }else{
    if(system) body.system=system;
  }
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify(body)
  });
  if(!res.ok){const t=await res.text();throw new Error('HTTP '+res.status+' '+t.slice(0,180));}
  const j=await res.json();
  if(tool){
    // Tool Use 响应：直接返回 input，无需任何 JSON 修复
    const tu=j.content.find(c=>c.type==='tool_use');
    if(!tu) throw new Error('API 未返回 tool_use（stop='+j.stop_reason+'）');
    return tu.input;
  }
  // 文本模式 fallback（含状态机修复）
  let txt=j.content.map(c=>c.text||'').join('').trim();
  txt=txt.replace(/```json|```/g,'').trim();
  const fi=txt.indexOf('{'),fa=txt.indexOf('[');
  let a,b;
  if(fa!==-1&&(fi===-1||fa<fi)){a=fa;b=txt.lastIndexOf(']');}
  else{a=fi;b=txt.lastIndexOf('}');}
  txt=txt.slice(a,b+1);
  try{return JSON.parse(txt);}catch(_){return JSON.parse(fixJsonNewlines(txt));}
}

/* ── CSV 解析 ─────────────────────────────────────── */
function parseCSVText(text){
  const lines = text.trim().split(/\r?\n/);
  if(lines.length < 2) return [];
  const parseRow = line => {
    const cells = []; let cur = '', inQ = false;
    for(let i = 0; i < line.length; i++){
      const ch = line[i];
      if(ch === '"'){
        if(inQ && line[i+1] === '"'){cur += '"'; i++;} else inQ = !inQ;
      } else if((ch === ',' || ch === '\t') && !inQ){
        cells.push(cur.trim()); cur = '';
      } else cur += ch;
    }
    cells.push(cur.trim());
    return cells;
  };
  const headers = parseRow(lines[0]).map(h => h.toLowerCase()
    .replace('标题','title').replace('获赞数','likes').replace('点赞','likes')
    .replace('收藏数','collects').replace('收藏','collects')
    .replace('评论数','comments').replace('标签','tags')
    .replace('正文','content_snippet').replace(/\n.*/,'').trim());
  return lines.slice(1).map(line => {
    const cells = parseRow(line);
    const obj = {};
    headers.forEach((h,i) => { obj[h] = cells[i] || ''; });
    return obj;
  }).filter(r => r.title || r['标题']);
}

async function runTrendLiveChunked(key, model){
  const gen=++_gen;
  const csvRaw = document.getElementById('csvText').value.trim();
  if(!csvRaw){ showErr('请粘贴或上传热帖 CSV 数据。'); return; }
  const keyword = document.getElementById('trendKeyword').value.trim();
  const pos = document.getElementById('positioning').value;

  // Parse and sort by engagement, take top 50
  let rows = parseCSVText(csvRaw);
  rows.sort((a,b) => {
    const sa = (parseInt(a.likes)||0) + (parseInt(a.collects)||0);
    const sb = (parseInt(b.likes)||0) + (parseInt(b.collects)||0);
    return sb - sa;
  });
  rows = rows.slice(0, 50);
  document.getElementById('csvStat').textContent = `分析 ${rows.length} 条（按互动排序 top 50）`;

  // Compact for prompt
  const postsStr = rows.map((r,i) =>
    `${i+1}. [赞${r.likes||0}/藏${r.collects||0}] ${r.title||''} ${r.tags?'标签:'+r.tags:''} ${r.content_snippet?r.content_snippet.slice(0,60):''}`
  ).join('\n');

  initTrendStages();

  // Phase 1 parallel: Trend Analysis + Pain Points
  let trendAnalysis, painPoints;
  await Promise.all([
    callChunk(key, model, PROMPT_TREND_ANALYSIS,
      `话题关键词：${keyword||'（未指定）'}\n账号定位：${pos}\n\n热帖数据（按互动量排序）：\n${postsStr}`, 2000)
    .then(d => { if(gen!==_gen)return; trendAnalysis = d.trendAnalysis; fillStage(1, buildTrendAnalysisHtml(trendAnalysis)); })
    .catch(e => fillStage(1, `<div class="err">① 热点归纳失败: ${esc(e.message)}</div>`)),

    callChunk(key, model, PROMPT_PAIN_POINTS,
      `以下是小红书「${keyword||'该话题'}」相关热帖的标题和内容，请从中归纳读者高频痛点：\n${postsStr}`, 1000,{
      name:'pain_points', description:'痛点归类',
      schema:{type:'object',required:['painPoints'],properties:{painPoints:{type:'array',items:{type:'object',
        required:['theme','intensity','count','evidence'],
        properties:{theme:{type:'string'},intensity:{type:'string',enum:['高','中']},count:{type:'integer'},evidence:{type:'array',items:{type:'string'}}}}}}}})
    .then(d => { if(gen!==_gen)return; painPoints = d.painPoints; fillStage(2, buildPainPointsHtml(painPoints)); })
    .catch(e => fillStage(2, `<div class="err">② 痛点归类失败: ${esc(e.message)}</div>`))
  ]);

  if(!trendAnalysis && !painPoints){ return; }

  // Phase 2: Topics + Titles
  let topics;
  try{
    const d = await callChunk(key, model, PROMPT_TOPICS_B,
      `账号定位：${pos}\n\n热点趋势分析：\n${JSON.stringify({trendAnalysis})}\n\n读者痛点：\n${JSON.stringify({painPoints})}`, 2000);
    topics = d.topics; titles = d.titles;
    _lastTopics[activeWorkflow]=topics;
    fillStage(3, buildTopicsHtml(topics));
    } catch(e){
    fillStage(3, `<div class="err">③ 选题生成失败: ${esc(e.message)}</div>`);
    fillStage(4, ''); return;
  }

  // Phase 3: Structure
  try{
    const chosen = topics[0]?.title || '';
    const d = await callChunk(key, model, PROMPT_STRUCTURE,
      `账号定位：${pos}\n\n热点背景：该话题下的爆款内容规律——${(trendAnalysis?.viralPatterns||[]).join('；')}\n\n选题：${chosen}`, 1500);
    fillStage(4, buildStructureHtml(d.structure));
  } catch(e){
    fillStage(4, `<div class="err">④ 结构复盘失败: ${esc(e.message)}</div>`);
  }
}

/* init */
fetch('./key').then(r=>r.ok?r.text():Promise.reject()).then(k=>{
  const el=document.getElementById('apiKey');
  if(el&&k.trim())el.value=k.trim();
}).catch(()=>{});
</script>
